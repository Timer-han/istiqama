version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: istiqama
      POSTGRES_USER: istiqama
      POSTGRES_PASSWORD: istiqama
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U istiqama -d istiqama"]
      interval: 5s
      timeout: 5s
      retries: 10

  tunnel:
    build: ./tunnel
    restart: unless-stopped
    environment:
      SSH_HOST: ${SSH_HOST}          # IP или домен зарубежной VPS
      SSH_USER: ${SSH_USER:-root}
      SSH_PORT: ${SSH_PORT:-22}
    volumes:
      # Путь к приватному ключу на хосте (без пароля)
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      tunnel:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://istiqama:istiqama@db:5432/istiqama
      ADMIN_IDS: ${ADMIN_IDS:-}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-60}
      WEBAPP_URL: ${WEBAPP_URL:-}
      # Прокси — имя сервиса в Docker-сети
      PROXY_URL: socks5://tunnel:1080
    env_file:
      - .env

  api:
    build: .
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      tunnel:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://istiqama:istiqama@db:5432/istiqama
      WEBAPP_URL: ${WEBAPP_URL:-}
      PROXY_URL: socks5://tunnel:1080
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data: